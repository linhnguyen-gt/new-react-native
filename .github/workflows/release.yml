name: Release

on:
    workflow_dispatch:
        inputs:
            bump:
                description: Which part of the version to raise. auto reads the conventional commits.
                type: choice
                options: [auto, patch, minor, major]
                default: auto
            version:
                description: Exact version (x.y.z) — overrides the bump above
                type: string
                default: ''
            prerelease:
                description: Mark the GitHub release as a pre-release
                type: boolean
                default: false

# Two releases at once would race on the version commit.
concurrency:
    group: release
    cancel-in-progress: false

jobs:
    verify:
        # A release is not a reason to skip the checks; this is the same job every push runs.
        uses: ./.github/workflows/ci.yml

    release:
        needs: verify
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            # Pushes the version commit and its tag, and creates the release.
            contents: write
        steps:
            - uses: actions/checkout@v5
              with:
                  # The notes are the commits since the previous tag, and a shallow clone has
                  # neither the history nor the tags.
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  # setup-node defaults package-manager-cache to true, reads `packageManager`
                  # from package.json and shells out to `pnpm store path`. This job installs no
                  # dependencies — the release script is plain node — so pnpm is not on PATH here
                  # and the default turns a cache warm-up into a hard failure.
                  package-manager-cache: false

            - name: Decide the version and write the notes
              id: prepare
              env:
                  # Used for the compare link at the foot of the notes.
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  BUMP: ${{ inputs.bump }}
                  # Through the environment, never interpolated into the script: an input is a
                  # string a human typed, and `${{ }}` in a run block is textual substitution.
                  VERSION: ${{ inputs.version }}
              run: |
                  args=("--bump=$BUMP")
                  if [ -n "$VERSION" ]; then
                      args+=("--version=$VERSION")
                  fi
                  node scripts/prepare-release.cjs "${args[@]}"

            - name: Commit and tag
              env:
                  TAG: ${{ steps.prepare.outputs.tag }}
                  NEW_VERSION: ${{ steps.prepare.outputs.version }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  # Only package.json: the notes file is written outside the working tree.
                  git add package.json
                  git commit -m "chore(release): $TAG"
                  git tag -a "$TAG" -m "Release $NEW_VERSION"
                  git push origin "HEAD:${{ github.ref_name }}"
                  git push origin "$TAG"

            - name: Publish the GitHub release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ steps.prepare.outputs.tag }}
                  NOTES_FILE: ${{ steps.prepare.outputs.notes_file }}
                  PRERELEASE: ${{ inputs.prerelease }}
              run: |
                  args=(--title "$TAG" --notes-file "$NOTES_FILE")
                  if [ "$PRERELEASE" = "true" ]; then
                      args+=(--prerelease)
                  fi
                  gh release create "$TAG" "${args[@]}"

            - name: Summary
              env:
                  TAG: ${{ steps.prepare.outputs.tag }}
                  PREVIOUS_TAG: ${{ steps.prepare.outputs.previous_tag }}
                  COMMIT_COUNT: ${{ steps.prepare.outputs.commit_count }}
                  NOTES_FILE: ${{ steps.prepare.outputs.notes_file }}
              run: |
                  {
                      echo "## Released $TAG"
                      echo ""
                      echo "- Previous tag: ${PREVIOUS_TAG:-(none)}"
                      echo "- Commits included: $COMMIT_COUNT"
                      echo ""
                      cat "$NOTES_FILE"
                  } >> "$GITHUB_STEP_SUMMARY"
